# Portable laptop battery profile derived from the active local TLP drop-in.
# Review CPU limits and device policy on the target laptop before enabling.
TLP_AUTO_SWITCH=1

CPU_ENERGY_PERF_POLICY_ON_BAT=power
CPU_BOOST_ON_BAT=0
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=30

PCIE_ASPM_ON_BAT=powersupersave
RUNTIME_PM_ON_BAT=auto
RUNTIME_PM_DRIVER_DENYLIST=""
USB_AUTOSUSPEND=1

SATA_LINKPWR_ON_BAT=min_power
AHCI_RUNTIME_PM_ON_BAT=auto
AHCI_RUNTIME_PM_TIMEOUT=8
DISK_IDLE_SECS_ON_BAT=5
MAX_LOST_WORK_SECS_ON_BAT=180

WIFI_PWR_ON_BAT=on
WOL_DISABLE=Y
DEVICES_TO_DISABLE_ON_BAT_NOT_IN_USE="bluetooth wwan"

SOUND_POWER_SAVE_ON_BAT=10
SOUND_POWER_SAVE_CONTROLLER=Y
NMI_WATCHDOG=0
